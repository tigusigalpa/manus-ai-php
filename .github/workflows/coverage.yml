name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: PHPUnit coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: curl, dom, mbstring, xml, xmlwriter
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress --no-audit

      - name: Generate coverage report
        run: composer test-coverage

      - name: Preserve the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          name: php-8.3
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
